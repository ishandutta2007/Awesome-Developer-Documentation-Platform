<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glowing Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #c084fc;
    }
    
    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 8s ease-in-out infinite; }
    .glowing-orb { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <circle class="glowing-orb" cx="200" cy="100" r="180" fill="#6366f1" filter="blur(60px)" opacity="0.3" />
  <circle class="glowing-orb" cx="1000" cy="300" r="200" fill="#a855f7" filter="blur(70px)" opacity="0.25" />

  <!-- Background Dynamic Visual Elements (Kept safely at sides/background) -->
  <g class="floating-card-1" opacity="0.4">
    <rect x="850" y="60" width="280" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="880" cy="90" r="12" fill="#6366f1" />
    <rect x="905" y="85" width="100" height="10" rx="5" fill="#94a3b8" />
    <rect x="880" y="115" width="220" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="880" y="135" width="160" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
  </g>

  <g class="floating-card-2" opacity="0.4">
    <rect x="900" y="220" width="240" height="130" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <rect x="925" y="245" width="80" height="12" rx="6" fill="#a855f7" />
    <rect x="925" y="270" width="190" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="925" y="290" width="140" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
    <rect x="925" y="310" width="170" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  </g>

  <!-- Decorative Flow Line -->
  <path d="M 800 350 Q 950 200 1150 250" fill="none" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)" />

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and contrast) -->
  <g transform="translate(80, 0)">
    <!-- Category Tag / Badge -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
      <text x="16" y="21" class="badge-text">⚡ CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="175" class="title">Awesome Developer</text>
    <text x="0" y="230" class="title" fill="url(#accentGradient)">Documentation Platforms 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="285" class="subtitle">SaaS Platforms &amp; Open-Source Projects for API Reference,</text>
    <text x="0" y="315" class="subtitle">Docs-as-Code, Knowledge Bases &amp; LLM-Ready Documentation</text>
  </g>
</svg>
